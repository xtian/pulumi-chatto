# Generates the Chatto API client from the pinned Chatto source: make generate
version: v2
managed:
  enabled: true
  disable:
    - file_option: go_package
      module: buf.build/bufbuild/protovalidate
  override:
    - file_option: go_package_prefix
      value: github.com/xtian/pulumi-chatto/internal/pb
plugins:
  - local: protoc-gen-go
    out: internal/pb
    opt:
      - paths=source_relative
  - local: protoc-gen-connect-go
    out: internal/pb
    opt:
      - paths=source_relative
